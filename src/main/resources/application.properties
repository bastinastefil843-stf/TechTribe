# ==========================================
# APPLICATION CONFIGURATION
# ==========================================

spring.application.name=techtribe-backend

server.port=${PORT:8080}

# ==========================================
# MYSQL DATABASE
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/techtribe}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=false

spring.jpa.open-in-view=false

# ==========================================
# SECURITY
# ==========================================

logging.level.org.springframework.security=INFO

jwt.secret=${JWT_SECRET}

# ==========================================
# GEMINI AI CONFIGURATION
# ==========================================

gemini.api.key=${GEMINI_API_KEY}

gemini.api.model=${GEMINI_API_MODEL:gemini-3.5-flash-lite}
# Frontend URL for CORS
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}