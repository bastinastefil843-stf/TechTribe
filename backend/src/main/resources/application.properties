# ==========================================
# APPLICATION CONFIGURATION
# ==========================================

spring.application.name=techtribe-backend

server.port=8080


# ==========================================
# MYSQL DATABASE
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/techtribe

spring.datasource.username=root

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=false

# Keep this disabled.
# The controller now handles the lazy-loading issue.
spring.jpa.open-in-view=false


# ==========================================
# SECURITY
# ==========================================

logging.level.org.springframework.security=INFO

jwt.secret=${JWT_SECRET}


# ==========================================
# GEMINI AI CONFIGURATION
# ==========================================

gemini.api.key=${GEMINI_API_KEY}

gemini.api.model=${GEMINI_API_MODEL:gemini-3.5-flash-lite}


# ==========================================
# FRONTEND CORS
# ==========================================

app.cors.allowed-origin=http://localhost:5173


# ==========================================
# LOGGING
# ==========================================

logging.level.org.springframework.web=INFO

logging.level.org.hibernate.SQL=WARN